<h1>BMW M6</h1>
<div class="m" aria-hidden="true"><i></i><i></i><i></i></div>
<p>Большое купе с характером гоночной машины: длинный капот, низкая посадка и двигатель, который слышно задолго до появления. Комфорт для дальней дороги и скорость, когда она нужна.</p>
<ul class="specs">
<li><b>560</b><span>л.с.</span></li>
<li><b>4,2 с</b><span>до 100 км/ч</span></li>
<li><b>V8</b><span>4,4 л, битурбо</span></li>
</ul>
<small>Данные для поколения F13 (2012–2018).</small>
